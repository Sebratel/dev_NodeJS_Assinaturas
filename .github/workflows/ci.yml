name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

# Menor privilégio: o CI só lê o repositório.
permissions:
  contents: read

# Push novo cancela o run anterior da mesma branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, testes, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'          # o mesmo da imagem Docker (node:22-alpine)
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build

  web:
    name: Web — tipos, testes, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Tipos
        run: npx tsc -b
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build

  imagem:
    name: Imagem Docker + smoke da stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: assinaturas-ci
      COMPOSE_FILES: -f docker-compose.portainer.yml -f .github/ci/docker-compose.ci.yml
      ELASTIC_APM_SERVER_URL: ''      # vazio = APM desligado. Sem isso o CI polui o APM de produção
      APP_PORT: '3080'                # porta do frontend; o backend não publica porta
      # Banco descartável do .github/ci/docker-compose.ci.yml: o smoke roda as migrations de verdade.
      DB_HOST: mariadb
      DB_USER: assinaturas
      DB_PASSWORD: ci-senha
      DB_NAME: assinaturas
      # Sem AD_BIND_*, como a produção enquanto a conta de leitura não existe: a API tem de subir mesmo assim.
      # (Em 23/11/2026 o CI passava porque preenchia AD_BIND_* com valor falso, e a produção reiniciava sem parar.)
    steps:
      - uses: actions/checkout@v4

      # O mesmo que o "Re-pull image" do Portainer faz antes do deploy. Sem `pull_policy: build`, falhava com
      # "pull access denied for assinaturas-frontend" (as imagens nascem do build, não existem em registry).
      - name: Pull como o Portainer
        run: docker compose $COMPOSE_FILES pull

      - name: Construir as imagens
        run: docker compose $COMPOSE_FILES build

      # --wait espera o healthcheck, o mesmo critério que o Portainer usa
      - name: Subir a stack
        run: docker compose $COMPOSE_FILES up -d --wait

      # Pelo frontend: testa também o repasse do nginx para o backend.
      - name: Health responde ok
        run: |
          curl -fsS --retry 15 --retry-delay 3 --retry-connrefused \
            http://localhost:3080/api/health -o health.json
          grep -q '"status":"ok"' health.json || {
            echo "::error::/api/health devolveu resposta inesperada:"; cat health.json; exit 1; }

      - name: Sem a conta do AD, a API sobe e avisa
        run: |
          docker compose $COMPOSE_FILES logs --no-color backend > backend.log
          grep -q 'AD não configurado' backend.log || {
            echo "::error::faltou o aviso de AD não configurado no log do backend"; tail -50 backend.log; exit 1; }
          grep -q '"ok":false' health.json || {
            echo "::error::/api/health deveria mostrar directory.ok=false sem a conta do AD"; cat health.json; exit 1; }

      - name: Backend não publica porta no servidor
        run: |
          bindings=$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$(docker compose $COMPOSE_FILES ps -q backend)")
          [ "$bindings" = "{}" ] || {
            echo "::error::o backend publicou porta no servidor ($bindings); só o frontend deve publicar"; exit 1; }

      - name: Migrations criaram as tabelas no MariaDB
        run: |
          docker compose $COMPOSE_FILES exec -T mariadb \
            mariadb -uassinaturas -pci-senha assinaturas -N -e "SHOW TABLES" > tables.txt
          for table in settings signature_rules signature_templates signature_applications phrase_profiles collaborator_overrides users typeorm_migrations; do
            grep -qx "$table" tables.txt || { echo "::error::tabela $table não existe"; cat tables.txt; exit 1; }
          done

      - name: Login exigido nas rotas da API
        run: |
          code=$(curl -s -o me.json -w '%{http_code}' http://localhost:3080/api/v1/me)
          [ "$code" = "401" ] || { echo "::error::/api/v1/me sem token devolveu $code (esperado 401)"; cat me.json; exit 1; }
          grep -q '"AUTH_REQUIRED"' me.json || { echo "::error::corpo inesperado:"; cat me.json; exit 1; }

      - name: Frontend serve as telas e as rotas da SPA
        run: |
          for path in / /monitoramento; do
            curl -fsS "http://localhost:3080$path" -o index.html
            grep -q '<div id="root"' index.html || {
              echo "::error::$path não devolveu o index.html do frontend"; head -c 500 index.html; exit 1; }
          done
          curl -fsS http://localhost:3080/healthz | grep -qx ok || { echo "::error::/healthz do nginx falhou"; exit 1; }

      - name: Logs da stack
        if: failure()
        run: docker compose $COMPOSE_FILES logs --no-color --timestamps > compose-logs.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt

      - name: Derrubar a stack
        if: always()
        run: docker compose $COMPOSE_FILES down -v

  # cicd-deploy-backend › validacoes-ci: regras de versão e de nomes valem pelo CI, não pela revisão.
  validacoes:
    name: Validações — versão e nomes do compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # o validador compara com a versão da branch base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # package.json (raiz) = api/ e web/ com locks = ${APP_VERSION:-X.Y.Z} do compose, e MAIOR que a do ambiente.
      # Mudar a versão: npm run version:set -- X.Y.Z (na raiz).
      - name: Versão
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          CHECK_REGISTRY: 'false'     # modelo A: o Portainer builda do Git, não há registry
        run: |
          python3 .github/scripts/validate-version.py
          for dir in api web; do
            v=$(node -p "require('./$dir/package.json').version")
            root=$(node -p "require('./package.json').version")
            [ "$v" = "$root" ] || { echo "::error::$dir/package.json está em $v e a raiz em $root: use npm run version:set"; exit 1; }
          done

      - name: Nomes do compose
        run: |
          pip install --quiet pyyaml
          target="${{ github.base_ref || github.ref_name }}"
          env=$([ "$target" = "main" ] && echo production || echo staging)
          python3 .github/scripts/validate-compose.py --repo "${{ github.event.repository.name }}" --env "$env" \
            --exceptions .github/compose-exceptions.txt --strict-ports docker-compose.portainer.yml

  # Check único para a proteção de branch. `if: always()` no job, senão ele é pulado quando
  # um `needs` falha e o check nunca reporta.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [validacoes, api, web, imagem]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Resultado agregado
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::Pelo menos um job não passou."; exit 1
          fi
          echo "Tudo verde."
