# Container `frontend`: telas + repasse de /api para o `backend` (rede interna da stack).

# requestId (observabilidade-backend): reaproveita o X-Request-Id da borda (NPM) ou cria um. O backend devolve o mesmo.
map $http_x_request_id $assinaturas_request_id {
    default $http_x_request_id;
    ""      $request_id;
}
# Protocolo original: atrás do NPM vem no X-Forwarded-Proto; acesso direto pela porta é http.
map $http_x_forwarded_proto $assinaturas_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Log de acesso em JSON, uma linha por requisição, com os nomes de campo do backend (observabilidade-backend).
# O nginx só mede em segundos: por isso durationSeconds, e não durationMs.
map $status $assinaturas_log_level {
    ~^5     error;
    ~^4     warn;
    default info;
}
log_format assinaturas_json escape=json
    '{"timestamp":"$time_iso8601","level":"$assinaturas_log_level","service":"assinaturas-frontend",'
    '"requestId":"$assinaturas_request_id","method":"$request_method","path":"$uri","status":$status,'
    '"durationSeconds":$request_time,"upstreamStatus":"$upstream_status","bytes":$body_bytes_sent}';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log assinaturas_json;

    # Quem pode exibir este sistema num quadro: ele mesmo e o Hub Apps (produção e staging).
    # Repetido em todo location com add_header próprio: no nginx, ele não herda os add_header do server.
    add_header Content-Security-Policy "frame-ancestors 'self' https://hub-apps.sebratel.net.br https://hub-apps-staging.sebratel.net.br" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Health do próprio nginx (Docker/Portainer). O da API é /api/health, repassado abaixo.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # DNS do Docker com variável: o nginx sobe mesmo com o backend fora do ar (responde 502) e
        # acha o IP novo quando o backend é recriado, sem precisar reiniciar o frontend.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $assinaturas_backend http://backend:3180;
        proxy_pass $assinaturas_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $assinaturas_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $assinaturas_forwarded_proto;

        # Gravação em lote no Gmail pode passar de 1 min; modelos HTML cabem com folga em 5 MB.
        proxy_read_timeout 300s;
        client_max_body_size 5m;
    }

    # Arquivos com hash no nome: cache de 1 ano.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "frame-ancestors 'self' https://hub-apps.sebratel.net.br https://hub-apps-staging.sebratel.net.br" always;
        try_files $uri =404;
    }

    # index.html nunca fica em cache (senão quem já abriu não recebe a versão nova); rotas da SPA caem nele.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self' https://hub-apps.sebratel.net.br https://hub-apps-staging.sebratel.net.br" always;
        try_files $uri $uri/ /index.html;
    }
}
