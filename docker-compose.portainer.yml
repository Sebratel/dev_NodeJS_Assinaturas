# Stack do Portainer, construída a partir do Git (sem registry). Ver README › Deploy no Portainer.
# `name` = nome do repositório no GitHub (Sebratel/dev_NodeJS_Assinaturas) em minúsculas = nome da stack no Portainer.
# Renomear depois cria volume NOVO e vazio.
name: dev_nodejs_assinaturas

# Dois containers, um repositório: `frontend` (telas, nginx) recebe o acesso e repassa /api para o `backend` (API)
# pela rede interna da stack. Só o frontend publica porta; o backend não fica exposto no servidor.
services:
  frontend:                           # papel do serviço; sem container_name (o Compose nomeia <stack>-frontend-1)
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # Públicos por design (vão para o JavaScript do navegador). Mudar exige rebuild da stack.
      args:
        APP_VERSION: ${APP_VERSION:-1.1.0}
        VITE_API_BASE_URL: /api
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-true}
        VITE_AUTH_HOSTED_DOMAIN: ${AUTH_ALLOWED_DOMAIN:-sebratel.com.br}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-sistema-gestor-assinatur-9be62.firebaseapp.com}
        VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-sistema-gestor-assinatur-9be62}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    image: assinaturas-frontend:${APP_VERSION:-1.1.0}
    labels:
      org.opencontainers.image.version: ${APP_VERSION:-1.1.0}
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "${APP_PORT:-3080}:8080"      # faixa Frontend / Web UI (3000–3099); ver cicd-deploy-backend › portas.md
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, nunca localhost (no Alpine, localhost resolve para ::1).
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.1.0}
    image: assinaturas-backend:${APP_VERSION:-1.1.0}
    labels:
      org.opencontainers.image.version: ${APP_VERSION:-1.1.0}
    mem_limit: 1g
    memswap_limit: 1g                 # igual ao mem_limit = sem swap
    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
      PORT: 3180
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-5000}

      # Login (padrao-login-sso). AUTH_ADMIN_EMAILS vazio = ninguém entra.
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-sistema-gestor-assinatur-9be62}
      AUTH_ALLOWED_DOMAIN: ${AUTH_ALLOWED_DOMAIN:-sebratel.com.br}
      AUTH_ADMIN_EMAILS: ${AUTH_ADMIN_EMAILS}

      # Banco: tabelas por migration ao subir (nunca synchronize).
      DB_TYPE: mariadb
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}     # valor vem do painel Environment da stack no Portainer
      DB_NAME: ${DB_NAME:-DB_Assinaturas}

      # Diretório: AD por LDAP com conta só de leitura. Sem AD_BIND_*, a API sobe e o Monitoramento mostra o motivo.
      DIRECTORY_SOURCE: ldap
      DIRECTORY_SYNC_INTERVAL_MINUTES: ${DIRECTORY_SYNC_INTERVAL_MINUTES:-10}
      AD_URL: ${AD_URL:-ldap://10.0.11.251}
      AD_BASE_DN: ${AD_BASE_DN:-DC=corp,DC=sebratel,DC=com,DC=br}
      AD_BIND_USER: ${AD_BIND_USER}
      AD_BIND_PASSWORD: ${AD_BIND_PASSWORD}

      # Google Workspace (conta de serviço com delegação). A chave vai inteira, JSON ou base64, no painel.
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID:-integracoes-senior-ad-gwa}
      GOOGLE_SERVICE_ACCOUNT_CLIENT_ID: ${GOOGLE_SERVICE_ACCOUNT_CLIENT_ID:-113892655020718818138}
      GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${GOOGLE_SERVICE_ACCOUNT_KEY_JSON}
      GOOGLE_DELEGATION_TEST_USER: ${GOOGLE_DELEGATION_TEST_USER}
      GOOGLE_APPLY_ALLOWLIST: ${GOOGLE_APPLY_ALLOWLIST}
      SIGNATURE_IMAGE_BASE_URL: ${SIGNATURE_IMAGE_BASE_URL:-https://raw.githubusercontent.com/Sebratel/dev_Sebratel_Images/main/}

      # Elastic APM (observabilidade-backend).
      # `-` sem dois-pontos DE PROPÓSITO: vazio desliga o agente (CI). Com `:-`, vazio cairia no padrão. Não "corrija".
      ELASTIC_APM_SERVER_URL: ${ELASTIC_APM_SERVER_URL-https://apm.sebratel.net.br}
      ELASTIC_APM_SERVICE_NAME: ${ELASTIC_APM_SERVICE_NAME:-assinaturas-backend}
      ELASTIC_APM_ENVIRONMENT: ${ELASTIC_APM_ENVIRONMENT:-production}
    # Sem `ports:`: só o frontend fala com a API (http://backend:3180). Diagnóstico: <porta do frontend>/api/health.
    expose:
      - "3180"
    volumes:
      - data:/app/data                # volume NOMEADO: deploy por repositório no Portainer apaga bind mount
    healthcheck:
      # 127.0.0.1, nunca localhost: no Alpine, localhost resolve para ::1 e a API escuta em IPv4.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3180/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  data:
